<sc-if value="{{it.on}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
</span>
</sc-if>
<sc-if value="{{it.locked}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;background:#2B2327;color:#FFFFFF;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
</sc-if>
<span style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
<span style="font-size:16px;font-weight:700;line-height:1.35;">{{it.name}}</span>
<span style="font-size:13px;line-height:1.45;color:#6E6266;">{{it.desc}}</span>
</span>
<span style="flex-shrink:0;font-size:15px;font-weight:700;color:{{it.priceColor}};font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;">{{it.priceLabel}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{itemsMore}}" hint-placeholder-val="{{ false }}">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{itemsMoreRot}}deg);"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</sc-if>
</div>

<div style="display:flex;flex-direction:column;gap:16px;">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;">
<h3 style="margin:0;font-size:19px;font-weight:700;"><span style="color:{{accent}};">{{stepOpts}}.</span> 추가 옵션</h3>
<span style="font-size:14px;color:#5F5458;">마감 옵션은 하나만 고를 수 있어요</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<button aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}" style="min-height:76px;box-sizing:border-box;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:18px;border:2px solid {{o.border}};background:#FFFFFF;color:#2B2327;text-align:left;">
<span style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:16px;font-weight:600;">{{o.name}}</span><span style="font-size:13px;color:#6E6266;">{{o.desc}}</span></span>
<span style="flex-shrink:0;width:46px;height:28px;box-sizing:border-box;padding:3px;border-radius:999px;background:{{o.track}};display:flex;justify-content:{{o.justify}};"><span style="width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(43,35,39,0.3);"></span></span>
</button>
</sc-for>
<div style="min-height:76px;box-sizing:border-box;padding:12px 12px 12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:18px;border:2px solid #FFFFFF;background:#FFFFFF;">
<span style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:16px;font-weight:600;">수정 횟수 추가</span><span style="font-size:13px;color:#6E6266;">{{revDesc}}</span></span>
<span style="display:flex;align-items:center;gap:4px;">
<button aria-label="수정 횟수 줄이기" onClick="{{revMinus}}" style="width:44px;height:44px;border-radius:50%;border:1px solid #EFE4E5;background:#F8F2F1;color:#2B2327;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span aria-live="polite" style="min-width:36px;text-align:center;font-size:17px;font-weight:700;">{{rev}}회</span>
<button aria-label="수정 횟수 늘리기" onClick="{{revPlus}}" style="width:44px;height:44px;border-radius:50%;border:1px solid #EFE4E5;background:#F8F2F1;color:#2B2327;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</span>
</div>
</div>
</div>
</div>

<div class="quote-col" style="flex:1 1 360px;max-width:440px;min-width:0;box-sizing:border-box;border-radius:28px;background:#FFFFFF;box-shadow:0 2px 4px rgba(80,40,55,0.06),0 28px 48px -20px rgba(80,40,55,0.35);display:flex;flex-direction:column;overflow:hidden;">
<div style="padding:20px 24px 22px;background:#2B2327;color:#FFFFFF;display:flex;flex-direction:column;gap:14px;">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
<span style="display:flex;align-items:baseline;gap:8px;">
<span style="font-size:17px;font-weight:700;">예상 견적서</span>
<span style="font-size:12px;color:#BFB1B6;">{{today}} 기준</span>
</span>
<button onClick="{{resetCalc}}" style="min-height:36px;padding:0 12px;border:1px solid #5A4C53;border-radius:999px;background:transparent;color:#FFFFFF;font-size:12px;font-weight:500;">초기화</button>
</div>
<div style="display:flex;flex-direction:column;gap:4px;">
<span style="font-size:13px;color:#D9CCD0;">총 예상 금액</span>
<span aria-live="polite" style="font-size:38px;font-weight:700;line-height:1.15;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;color:#FFFFFF;">{{total}}</span>
</div>
<sc-if value="{{hasSave}}" hint-placeholder-val="{{ false }}">
<span style="align-self:flex-start;height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;border-radius:8px;background:#E3F1EA;color:#1F6146;font-size:13px;font-weight:700;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>세트 할인 {{saveShort}} 적용</span>
</sc-if>
</div>
<div style="padding:18px 24px 24px;display:flex;flex-direction:column;gap:16px;">
<sc-if value="{{noLines}}" hint-placeholder-val="{{ false }}">
<div style="padding:24px 16px;border-radius:14px;background:#F8F2F1;text-align:center;font-size:14px;line-height:1.7;color:#6E6266;">세트 상품이나 개별 작업을<br>선택해 주세요</div>
</sc-if>
<sc-if value="{{hasLines}}" hint-placeholder-val="{{ true }}">
<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;">
<sc-for list="{{quoteLines}}" as="q" hint-placeholder-count="3">
<li style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F3EAEC;">
<span style="flex-shrink:0;margin-top:1px;min-width:34px;height:22px;padding:0 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:6px;background:{{q.tagBg}};color:{{q.tagColor}};font-size:11px;font-weight:700;">{{q.tag}}</span>
<span style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
<span style="font-size:15px;font-weight:600;line-height:1.4;">{{q.name}}</span>
<sc-if value="{{q.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:1.5;color:#6E6266;">{{q.sub}}</span></sc-if>
</span>
<span style="flex-shrink:0;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;">{{q.amount}}</span>
</li>
</sc-for>
</ul>
<sc-if value="{{hasBreakdown}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#6E6266;font-variant-numeric:tabular-nums;">
<span>정가 {{listLabel}}</span>
<sc-if value="{{hasSave}}" hint-placeholder-val="{{ false }}"><span style="color:#1F6146;font-weight:600;">할인 {{saveLabel}}</span></sc-if>
<sc-if value="{{hasOpt}}" hint-placeholder-val="{{ false }}"><span>옵션 {{optLabel}}</span></sc-if>
</div>
</sc-if>
</sc-if>
<p style="margin:0;font-size:12px;line-height:1.6;color:#6E6266;">최종 금액은 레퍼런스와 아바타 상태를 확인한 뒤 확정돼요.</p>
<a href="#inquiry" style="height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:{{accent}};color:#FFFFFF;font-size:16px;font-weight:600;box-shadow:0 10px 20px -8px rgba(164,73,91,0.6);">이 견적으로 문의서 쓰기
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="m6 13 6 6 6-6"></path></svg>
</a>
</div>
</div>
</div>
</div>
</section>

<section id="process" style="background:#FFFFFF;border-top:1px solid #EFE4E5;">
<div style="max-width:1280px;width:100%;margin:0 auto;box-sizing:border-box;padding:88px clamp(20px,5vw,80px);display:flex;flex-direction:column;gap:32px;">
<div style="display:flex;flex-direction:column;gap:10px;">
<span style="display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:0.14em;color:{{accent}};"><span aria-hidden="true" style="width:28px;height:2px;border-radius:2px;background:{{accent}};"></span>07 · PROCESS</span>
<h2 style="margin:0;font-weight:700;font-size:clamp(28px,3.4vw,38px);line-height:1.3;">이렇게 진행돼요</h2>
<p style="margin:0;font-size:16px;line-height:1.6;color:#6E6266;">문의부터 전달까지 6단계예요. 단계마다 진행 상황을 알려드려요.</p>
</div>
<div style="box-sizing:border-box;padding:clamp(28px,4vw,48px) clamp(20px,3vw,36px);border-radius:32px;background:#FFFFFF;border:1px solid #EFE4E5;box-shadow:0 2px 4px rgba(80,40,55,0.05),0 28px 48px -28px rgba(80,40,55,0.3);">
<ol class="proc" style="margin:0;padding:0;list-style:none;">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li class="proc-step">
<sc-if value="{{s.notLast}}" hint-placeholder-val="{{ true }}"><span class="proc-line" aria-hidden="true"></span></sc-if>
<span style="position:relative;z-index:1;flex-shrink:0;width:56px;height:56px;box-sizing:border-box;border-radius:50%;border:2px solid {{accent}};background:{{s.circleBg}};color:{{s.circleColor}};display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #FFFFFF;">
<sc-if value="{{s.iChat}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"></path><path d="M8.5 12h.01"></path><path d="M12 12h.01"></path><path d="M15.5 12h.01"></path></svg></sc-if>
<sc-if value="{{s.iQuote}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg></sc-if>
<sc-if value="{{s.iPay}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="m9 15 2 2 4-4"></path></svg></sc-if>
<sc-if value="{{s.iWork}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5"></path><path d="M13.5 5.5 4 15v5h5l9.5-9.5"></path><path d="M3 21h4"></path></svg></sc-if>
<sc-if value="{{s.iCheck}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
<sc-if value="{{s.iDone}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8v13H3V8"></path><path d="M1 3h22v5H1z"></path><path d="M10 12h4"></path></svg></sc-if>
</span>
<span class="proc-body">
<span style="font-size:12px;font-weight:700;letter-spacing:0.1em;color:{{accent}};">STEP {{s.no}}</span>
<span style="font-size:18px;font-weight:700;line-height:1.35;color:#2B2327;white-space:nowrap;">{{s.title}}</span>
<span class="proc-desc" style="font-size:14px;line-height:1.6;color:#6E6266;">{{s.desc}}</span>
<span class="proc-chip" style="align-self:{{s.chipAlign}};height:28px;white-space:nowrap;padding:0 10px;display:flex;align-items:center;border-radius:8px;background:#F5E8EA;color:#5F5458;font-size:12px;font-weight:600;">{{s.chip}}</span>
</span>
</li>
</sc-for>
</ol>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
<div style="box-sizing:border-box;padding:18px 22px;border-radius:20px;background:#F3E1E4;display:flex;align-items:center;justify-content:space-between;gap:12px;">
<span style="font-size:14px;color:#5F5458;">작업 기한</span><span style="font-size:18px;font-weight:700;">7~14일</span>
</div>
<div style="box-sizing:border-box;padding:18px 22px;border-radius:20px;background:#F3E1E4;display:flex;align-items:center;justify-content:space-between;gap:12px;">
<span style="font-size:14px;color:#5F5458;">기본 수정 횟수</span><span style="font-size:18px;font-weight:700;">[N]회</span>
</div>
<div style="box-sizing:border-box;padding:18px 22px;border-radius:20px;background:#F3E1E4;display:flex;align-items:center;justify-content:space-between;gap:12px;">
<span style="font-size:14px;color:#5F5458;">결제 방식</span><span style="font-size:18px;font-weight:700;">[선금 N%]</span>
</div>
</div>
</div>
</section>

<section id="inquiry" style="background:#2B2327;color:#FFFFFF;">
<div style="max-width:1280px;margin:0 auto;box-sizing:border-box;padding:88px clamp(20px,5vw,80px);display:flex;flex-direction:column;gap:32px;">
<div style="display:flex;flex-direction:column;gap:10px;">
<span style="display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:0.14em;color:#F2B8C4;"><span aria-hidden="true" style="width:28px;height:2px;border-radius:2px;background:#F2B8C4;"></span>08 · INQUIRY</span>
<h2 style="margin:0;font-weight:700;font-size:clamp(28px,3.4vw,38px);line-height:1.3;color:#FFFFFF;">문의 양식을 채우고 복사해서 보내주세요</h2>
<p style="margin:0;font-size:16px;line-height:1.6;color:#D9CCD0;">빈칸을 채우면 오른쪽 양식이 바로 바뀌어요. 복사한 뒤 문의 채널에 붙여넣기만 하면 돼요.</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:stretch;">
<form onSubmit="{{noSubmit}}" style="flex:1 1 420px;min-width:0;box-sizing:border-box;padding:28px;border-radius:28px;background:#FFFFFF;color:#2B2327;display:flex;flex-direction:column;gap:18px;">
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="f-nick" style="font-size:14px;font-weight:600;">닉네임 / 방송명</label>
<input id="f-nick" type="text" value="{{fNick}}" onChange="{{onNick}}" placeholder="예: 무리 / 무리의 작업방송" style="height:48px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #E2CFD3;background:#FBF8F8;font-size:15px;color:#2B2327;">
</div>
<fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px;">
<legend style="padding:0;margin-bottom:8px;font-size:14px;font-weight:600;">방송 플랫폼</legend>
<div style="display:flex;flex-wrap:wrap;gap:8px;">
<sc-for list="{{platforms}}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="height:44px;padding:0 18px;border-radius:999px;border:1px solid {{p.border}};background:{{p.bg}};color:{{p.color}};font-size:14px;font-weight:500;">{{p.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="f-contact" style="font-size:14px;font-weight:600;">연락받을 곳</label>
<input id="f-contact" type="text" value="{{fContact}}" onChange="{{onContact}}" placeholder="디스코드 아이디 / 이메일" style="height:48px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #E2CFD3;background:#FBF8F8;font-size:15px;color:#2B2327;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="f-ref" style="font-size:14px;font-weight:600;">레퍼런스 링크</label>
<input id="f-ref" type="text" value="{{fRef}}" onChange="{{onRef}}" placeholder="이미지·영상 링크를 붙여넣어 주세요" style="height:48px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #E2CFD3;background:#FBF8F8;font-size:15px;color:#2B2327;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="f-memo" style="font-size:14px;font-weight:600;">요청사항</label>
<textarea id="f-memo" rows="3" value="{{fMemo}}" onChange="{{onMemo}}" placeholder="원하는 분위기, 꼭 살리고 싶은 부분 등" style="box-sizing:border-box;padding:12px 16px;border-radius:14px;border:1px solid #E2CFD3;background:#FBF8F8;font-size:15px;line-height:1.6;color:#2B2327;resize:vertical;"></textarea>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:14px 16px;border-radius:14px;background:#F5E8EA;font-size:14px;">
<span><span style="color:#6E6266;">계산기 견적</span> <strong style="font-weight:700;">{{quoteSummary}}</strong></span>
<a href="#price" style="min-height:32px;display:flex;align-items:center;color:{{accent}};font-weight:600;text-decoration:underline;text-underline-offset:4px;">항목 바꾸기</a>
</div>
<label for="f-agree" style="min-height:52px;box-sizing:border-box;padding:12px 16px;display:flex;align-items:center;gap:12px;border-radius:14px;border:2px solid {{agreeBorder}};background:{{agreeBg}};font-size:15px;font-weight:600;cursor:pointer;">
<input id="f-agree" type="checkbox" checked="{{fAgree}}" onChange="{{onAgree}}" style="flex-shrink:0;width:22px;height:22px;margin:0;accent-color:#A4495B;cursor:pointer;">
<span style="flex-grow:1;"><a href="#notice" style="text-decoration:underline;text-underline-offset:4px;">주의사항</a>을 모두 확인했어요</span>
<span style="flex-shrink:0;font-size:12px;font-weight:600;color:{{agreeTagColor}};">{{agreeTag}}</span>
</label>
</form>
